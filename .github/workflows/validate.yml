name: Validate XMU templates
on: [push, pull_request]
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r skills/xmu-ppt/requirements-core.txt
      - run: python -m unittest discover -s tests -v
      - run: python skills/xmu-ppt/scripts/audit_xmu.py --check-svg
      - run: python scripts/check_docs.py
      - run: python scripts/check_assets.py
      - run: python scripts/check_privacy.py
      - run: python skills/xmu-ppt/scripts/svg_quality_checker.py examples/quickstart/svg_output --canonical-authoring
      - run: python skills/xmu-ppt/scripts/review_pptx.py examples/quickstart/demo.pptx --min-level warn
