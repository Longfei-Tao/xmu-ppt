<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>选择模板 · xmu-ppt</title>
  <link rel="stylesheet" href="static/gallery.css">
  <script src="static/gallery.js" defer></script>
</head>
<body>
  <header><a href="https://github.com/Longfei-Tao/xmu-ppt">xmu-ppt</a><span>厦门大学 PPT 模板库</span></header>
  <main>
    <p class="eyebrow">01 选择模板 → 02 整理内容 → 03 生成 PPT</p>
    <h1>先选喜欢的风格</h1>
    <p id="intro">先看每一页的真实版式，选定模板后开始制作。</p>
    <section class="filters" aria-label="筛选模板">
      <label>使用场景<select id="scene"><option value="">全部场景</option><option>答辩</option><option>开题</option><option>课程</option><option>人文社科</option><option>组会</option><option>工作汇报</option></select></label>
      <label>搜索模板<input id="search" type="search" placeholder="名称、配色或风格"></label>
    </section>
    <p id="status" role="status" aria-live="polite">正在加载模板…</p>
    <div id="cards" class="cards"></div>
    <p class="notice">预览展示的是原模板的真实页面（示例文字）。只有完成全页入库的模板才能使用原生填充；项目为非官方个人作品，模板名称中的历史“官方”字样不代表学校授权。</p>
  </main>
  <dialog id="detail" aria-labelledby="detail-title">
    <div class="dialog-head"><h2 id="detail-title"></h2><button id="close" type="button">关闭</button></div>
    <p id="description"></p>
    <p id="page-status" role="status" aria-live="polite">正在读取模板全页信息…</p>
    <div class="page-grid" id="pages" hidden></div>
    <div class="preview-grid" id="previews"></div>
    <label>制作方式<select id="route"><option value="native">保持原版式 · 原生填充（仅替换文字）</option><option value="svg">灵活排版 · 会重新设计布局（不推荐）</option></select></label>
    <p id="route-hint"></p>
    <p id="coverage-warning" class="warning" role="status" aria-live="polite" hidden></p>
    <label id="prompt-label" hidden>复制后发给 AI<textarea id="prompt" rows="4" readonly></textarea></label>
    <p id="selection-status" role="status" aria-live="polite"></p>
    <button id="choose" class="primary" type="button">确认使用此模板</button>
  </dialog>
</body>
</html>
