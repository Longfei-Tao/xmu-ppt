<g id="shape-6" data-name="文本框 5">
<rect x="238.27" y="272.4" width="706.13" height="300.4" fill="none"/>
<text x="320.53" y="304.4" text-anchor="start" xml:space="preserve" font-family="&quot;黑体&quot;, sans-serif" font-size="32" fill="#9DC3E6"><tspan fill="#9DC3E6" font-size="32">无论是扎根于厦大这片热土辛勤耕耘的全体师生</tspan><tspan x="320.53" dy="48" fill="#9DC3E6" font-size="32">，还是从温暖的厦大校园走向五湖四海的广大校</tspan><tspan x="320.53" dy="48" fill="#9DC3E6" font-size="32">友，都怀着至深至纯的</tspan><tspan fill="#2E75B6" font-size="32">大爱情怀</tspan><tspan fill="#9DC3E6" font-size="32">，以</tspan><tspan fill="#2E75B6" font-size="32">自强不息</tspan><tspan fill="#9DC3E6" font-size="32">的</tspan><tspan x="320.53" dy="48" fill="#9DC3E6" font-size="32">奋斗和</tspan><tspan fill="#2E75B6" font-size="32">止于至善</tspan><tspan fill="#9DC3E6" font-size="32">的追求在各自岗位上奋发进取，</tspan><tspan x="320.53" dy="48" fill="#9DC3E6" font-size="32">创造了一个又一个非凡业绩。</tspan></text>
</g></svg>