  <text x="960" y="258" fill="#6585CC" font-family="微软雅黑, Microsoft YaHei, PingFang SC, sans-serif" font-size="16">{{TOC_ITEM_2_DESC}}</text>

  <!-- 条目 03 / 04 -->
  <text x="520" y="420" fill="#4661CC" font-family="Manrope, Arial, sans-serif" font-size="40" font-weight="bold">03</text>
  <text x="600" y="415" fill="#4661CC" font-family="微软雅黑, Microsoft YaHei, PingFang SC, sans-serif" font-size="32" font-weight="bold">{{TOC_ITEM_3_TITLE}}</text>
  <text x="600" y="448" fill="#6585CC" font-family="微软雅黑, Microsoft YaHei, PingFang SC, sans-serif" font-size="16">{{TOC_ITEM_3_DESC}}</text>

