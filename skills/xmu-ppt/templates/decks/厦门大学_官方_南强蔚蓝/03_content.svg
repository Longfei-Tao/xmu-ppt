<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A2CAFF"/>
      <stop offset="45%" stop-color="#CEDCFF"/>
      <stop offset="100%" stop-color="#FAEEFF"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#bgGradient)"/>

  <image x="1120" y="42" width="110" height="32" xlink:href="xmu_logo.png" preserveAspectRatio="xMidYMid meet"/>

  <!-- 页面标题 -->
  <text x="100" y="112" fill="#4661CC" font-family="方正兰亭黑, FZLanTingHeiS-DB-GB, 微软雅黑, Microsoft YaHei, PingFang SC, sans-serif" font-size="42" font-weight="bold">{{PAGE_TITLE}}</text>
  <text x="430" y="112" fill="#4661CC" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="bold" letter-spacing="2">PART {{CHAPTER_NUM}}</text>

  <!-- 内容卡片 -->
  <rect x="100" y="170" width="1080" height="440" rx="28" fill="#FFFFFF" fill-opacity="0.35"/>
  <text x="640" y="404" text-anchor="middle" fill="#7E93C8" font-family="微软雅黑, Microsoft YaHei, PingFang SC, sans-serif" font-size="18">{{CONTENT_AREA}}</text>

  <!-- 页脚 -->
  <text x="100" y="660" fill="#4661CC" font-family="微软雅黑, Microsoft YaHei, PingFang SC, sans-serif" font-size="14">{{SECTION_NAME}}</text>
  <text x="1180" y="660" text-anchor="end" fill="#4661CC" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="bold">{{PAGE_NUM}}</text>
</svg>
