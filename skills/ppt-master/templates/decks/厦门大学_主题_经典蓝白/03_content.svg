<g id="shape-5" data-name="文本框 4">
<rect x="199.22" y="264.63" width="881.55" height="251.93" fill="none"/>
<text x="208.82" y="292.1" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑&quot;, &quot;黑体&quot;, sans-serif" font-size="26.67" fill="#FFFFFF" font-weight="bold"><tspan fill="#FFFFFF" font-size="26.67" font-weight="bold">厦门大学（Xiamen University）</tspan><tspan fill="#FFFFFF" font-size="26.67">，简称厦大(XMU) ，由著名爱国华侨领</tspan><tspan x="208.82" dy="40" fill="#FFFFFF" font-size="26.67">袖陈嘉庚先生于1921年创办, 是中国近代教育史上第一所华侨创办的大学</tspan><tspan x="208.82" dy="40" fill="#FFFFFF" font-size="26.67">。学校秉持爱国华侨领袖陈嘉庚先生的立校志向，形成了“爱国、革命、</tspan><tspan x="208.82" dy="40" fill="#FFFFFF" font-size="26.67">自强、科学”的优良校风，打造了鲜明的办学特色，培养了大批优秀人才</tspan><tspan x="208.82" dy="40" fill="#FFFFFF" font-size="26.67">，为国家富强、人民幸福和中华文化海外传播作出了积极贡献。</tspan></text>
</g>
