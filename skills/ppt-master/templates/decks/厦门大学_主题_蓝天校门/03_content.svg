<g id="shape-5" data-name="文本占位符 4" data-ph-type="body">
<rect x="569.03" y="140.58" width="676.99" height="487.06" fill="none"/>
<text x="578.63" y="181.38" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑 Light&quot;, sans-serif" font-size="26.67" fill="#001C3B" font-weight="bold"><tspan fill="#001C3B" font-size="26.67" font-weight="bold">厦门大学（</tspan><tspan fill="#001C3B" font-size="26.67" font-weight="bold">Xiamen University</tspan><tspan fill="#001C3B" font-size="26.67" font-weight="bold">），</tspan><tspan fill="#001C3B" font-size="26.67">简称厦大</tspan><tspan fill="#001C3B" font-size="26.67">(</tspan><tspan fill="#001C3B" font-size="26.67">XMU</tspan><tspan fill="#001C3B" font-size="26.67">) </tspan><tspan fill="#001C3B" font-size="26.67">，</tspan><tspan x="578.63" dy="53.33" fill="#001C3B" font-size="26.67">由著名爱国华侨领袖陈嘉庚先生于</tspan><tspan fill="#001C3B" font-size="26.67">1921</tspan><tspan fill="#001C3B" font-size="26.67">年创办</tspan><tspan fill="#001C3B" font-size="26.67">, </tspan><tspan fill="#001C3B" font-size="26.67">是中国</tspan><tspan x="578.63" dy="53.33" fill="#001C3B" font-size="26.67">近代教育史上第一所华侨创办的大学。</tspan></text>
<text x="578.63" y="354.71" text-anchor="start" xml:space="preserve" font-family="&quot;微软雅黑 Light&quot;, sans-serif" font-size="26.67" fill="#001C3B"><tspan fill="#001C3B" font-size="26.67">学校秉持爱国华侨领袖陈嘉庚先生的立校志向，形成了</tspan><tspan x="578.63" dy="53.33" fill="#001C3B" font-size="26.67" font-weight="bold">“爱国、革命、自强、科学”</tspan><tspan fill="#001C3B" font-size="26.67">的优良校风，打造了鲜明的</tspan><tspan x="578.63" dy="53.33" fill="#001C3B" font-size="26.67">办学特色，培养了大批优秀人才，为国家富强、人民幸</tspan><tspan x="578.63" dy="53.33" fill="#001C3B" font-size="26.67">福和中华文化海外传播作出了积极贡献。</tspan></text>
</g>
