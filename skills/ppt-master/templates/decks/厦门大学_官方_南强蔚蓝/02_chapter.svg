<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A2CAFF"/>
      <stop offset="45%" stop-color="#CEDCFF"/>
      <stop offset="100%" stop-color="#FAEEFF"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#bgGradient)"/>

  <!-- 章节页水印：校徽以 10% 不透明度压在背景上、内容之下 -->
  <image x="70" y="175" width="380" height="109.1" xlink:href="xmu_logo_wm.png" preserveAspectRatio="xMidYMid meet"/>

  <!-- 分栏白线 -->
  <line x1="480" y1="0" x2="480" y2="720" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2"/>
  <line x1="480" y1="350" x2="1280" y2="350" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2"/>
  <line x1="0" y1="600" x2="480" y2="600" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2"/>

  <image x="1120" y="42" width="110" height="32" xlink:href="xmu_logo.png" preserveAspectRatio="xMidYMid meet"/>

  <!-- 左侧章节大字 -->
  <text x="100" y="440" fill="#4661CC" font-family="方正兰亭黑, FZLanTingHeiS-DB-GB, 微软雅黑, Microsoft YaHei, PingFang SC, sans-serif" font-size="44" font-weight="bold">{{CHAPTER_TITLE}}</text>
  <text x="100" y="505" fill="#4661CC" font-family="Manrope, Arial, sans-serif" font-size="34" font-weight="bold" letter-spacing="3">PART {{CHAPTER_NUM}}</text>

  <!-- 右侧要点 -->
  <text x="520" y="200" fill="#6585CC" font-family="微软雅黑, Microsoft YaHei, PingFang SC, sans-serif" font-size="16">{{CHAPTER_DESC}}</text>

  <text x="520" y="290" fill="#4661CC" font-family="微软雅黑, Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="bold">{{CHAPTER_POINT_1}}</text>
  <text x="520" y="322" fill="#6585CC" font-family="微软雅黑, Microsoft YaHei, PingFang SC, sans-serif" font-size="15">{{CHAPTER_POINT_1_DESC}}</text>

  <text x="520" y="430" fill="#4661CC" font-family="微软雅黑, Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="bold">{{CHAPTER_POINT_2}}</text>
  <text x="520" y="462" fill="#6585CC" font-family="微软雅黑, Microsoft YaHei, PingFang SC, sans-serif" font-size="15">{{CHAPTER_POINT_2_DESC}}</text>

  <text x="520" y="565" fill="#4661CC" font-family="微软雅黑, Microsoft YaHei, PingFang SC, sans-serif" font-size="24" font-weight="bold">{{CHAPTER_POINT_3}}</text>
  <text x="520" y="597" fill="#6585CC" font-family="微软雅黑, Microsoft YaHei, PingFang SC, sans-serif" font-size="15">{{CHAPTER_POINT_3_DESC}}</text>
</svg>
