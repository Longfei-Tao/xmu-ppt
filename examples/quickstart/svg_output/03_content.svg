<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect width="18" height="720" fill="#005FA5"/>
  <text x="80" y="92" font-family="Microsoft YaHei" font-size="20" fill="#005FA5">XMU PPT MASTER / 工作流演示</text>
  <text x="80" y="187" font-family="Microsoft YaHei" font-size="44" font-weight="bold" fill="#17324D">协作方案</text>
  <text x="80" y="240" font-family="Microsoft YaHei" font-size="24" fill="#50677E">先统一材料，再明确分工，最后安排复核</text>
  <line x1="80" y1="278" x2="1200" y2="278" stroke="#BAE2FF" stroke-width="2"/>
  <text x="80" y="352" font-family="Microsoft YaHei" font-size="28" font-weight="bold" fill="#005FA5">当前问题</text>
  <text x="80" y="414" font-family="Microsoft YaHei" font-size="26" fill="#17324D">材料散落在不同会话中</text>
  <text x="80" y="467" font-family="Microsoft YaHei" font-size="26" fill="#17324D">任务缺少明确的负责人</text>
  <text x="80" y="520" font-family="Microsoft YaHei" font-size="26" fill="#17324D">提交前缺少统一检查</text>
  <rect x="680" y="318" width="520" height="256" fill="#EDF5FC"/>
  <text x="716" y="365" font-family="Microsoft YaHei" font-size="28" font-weight="bold" fill="#005FA5">建议做法</text>
  <text x="716" y="420" font-family="Microsoft YaHei" font-size="26" fill="#17324D">建立共享目录和命名约定</text>
  <text x="716" y="473" font-family="Microsoft YaHei" font-size="26" fill="#17324D">每项任务标注负责人和期限</text>
  <text x="716" y="526" font-family="Microsoft YaHei" font-size="26" fill="#17324D">用检查清单完成交付复核</text>
  <line x1="80" y1="635" x2="1200" y2="635" stroke="#BAE2FF" stroke-width="2"/>
  <text x="80" y="680" font-family="Microsoft YaHei" font-size="16" fill="#50677E">示例方案，用于演示正文排版，不构成效果承诺</text>
  <text x="1160" y="680" font-family="Microsoft YaHei" font-size="16" fill="#005FA5">03</text>
</svg>
